<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Squishy RNG V1</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10152e,#31567b);font-family:Arial;color:white}.app{width:min(720px,94%);padding:30px;text-align:center;border-radius:28px;background:#ffffff12;backdrop-filter:blur(14px);box-shadow:0 25px 70px #0008}h1{font-size:40px}h1 span{color:#6be0ff}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.stat{padding:10px 18px;background:#ffffff12;border-radius:14px}.stat b{display:block;font-size:20px}#food{font-size:145px;margin:25px}.rolling{animation:r .09s infinite alternate}@keyframes r{to{transform:scale(1.08) rotate(5deg)}}button{padding:15px 28px;margin:5px;border:0;border-radius:14px;font-weight:900;font-size:17px;cursor:pointer;background:#6875ff;color:white}#roll{font-size:22px;padding:17px 55px;background:linear-gradient(135deg,#875cff,#31d3ff)}.panel{margin-top:22px;padding:18px;background:#ffffff0b;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.item{padding:10px;border-radius:12px;background:#ffffff0b;font-size:32px}small{display:block;font-size:11px;color:#b9c7df}.Common{color:#c4cad4}.Uncommon{color:#6bea8d}.Rare{color:#65bdff}.Epic{color:#c982ff}.Legendary{color:#ffd34f}@media(max-width:550px){.grid{grid-template-columns:repeat(3,1fr)}#food{font-size:110px}}</style></head>
<body><div class="app"><h1>🍔 Food Squishy <span>RNG V1</span></h1><p>The simple original Food Squishy RNG.</p>
<div class="stats"><div class="stat">🪙 Coins<b id="coins">0</b></div><div class="stat">🎰 Rolls<b id="rolls">0</b></div><div class="stat">📖 Collection<b id="count">0 / 15</b></div></div>
<div id="food">❔</div><h2 id="name">Ready to roll!</h2><div id="rarity">—</div><button id="roll">🎲 ROLL</button><button id="reset">🔄 Reset Save</button>
<div class="panel"><h2>📖 Collection</h2><div id="collection" class="grid"></div></div></div>
<script>const foods=[["🍎", "Apple", "Common"],["🍌", "Banana", "Common"],["🍕", "Pizza", "Common"],["🍔", "Burger", "Common"],["🍟", "Fries", "Uncommon"],["🍩", "Donut", "Uncommon"],["🌮", "Taco", "Uncommon"],["🍿", "Popcorn", "Rare"],["🍣", "Sushi", "Rare"],["🍰", "Cake", "Rare"],["🍦", "Ice Cream", "Epic"],["🍪", "Cookie", "Epic"],["🍫", "Chocolate", "Epic"],["🧁", "Cupcake", "Legendary"],["🍓", "Golden Strawberry", "Legendary"]];const weights={Common:55,Uncommon:27,Rare:12,Epic:5,Legendary:1};let s=JSON.parse(localStorage.getItem("foodSquishyV1")||'{"coins":0,"rolls":0,"owned":[]}');const $=x=>document.getElementById(x);
function save(){localStorage.setItem("foodSquishyV1",JSON.stringify(s))}function render(){$("coins").textContent=s.coins;$("rolls").textContent=s.rolls;$("count").textContent=s.owned.length+" / 15";$("collection").innerHTML=foods.map(f=>`<div class="item ${f[2]}">${s.owned.includes(f[1])?f[0]:"❔"}<small>${s.owned.includes(f[1])?f[1]:"???"}</small></div>`).join("")}
function pick(){let r=Math.random()*100;for(const [rar,w] of Object.entries(weights)){r-=rar? w:0;if(r<=0){let a=foods.filter(f=>f[2]===rar);return a[Math.floor(Math.random()*a.length)]}}}
function roll(){$("roll").disabled=true;$("food").classList.add("rolling");let i=0,t=setInterval(()=>{$("food").textContent=foods[Math.floor(Math.random()*foods.length)][0];if(++i>=18){clearInterval(t);finish(pick())}},70)}
function finish(f){$("food").classList.remove("rolling");$("food").textContent=f[0];$("name").textContent=f[1];$("rarity").textContent=f[2];$("rarity").className=f[2];s.rolls++;s.coins+=f[2]==="Legendary"?100:f[2]==="Epic"?30:f[2]==="Rare"?15:5;if(!s.owned.includes(f[1]))s.owned.push(f[1]);save();render();$("roll").disabled=false}$("roll").onclick=roll;$("reset").onclick=()=>{if(confirm("Reset V1 save?")){localStorage.removeItem("foodSquishyV1");location.reload()}};render();</script></body></html>
